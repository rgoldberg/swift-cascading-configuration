#
# .vale.ini
# swift-cascading-configuration
#
# Vale 3.28.1
#

Grammars = c, yaml
StylesPath = .vale
MinAlertLevel = suggestion

[*.{md,swift,yaml,yml}]
BasedOnStyles = scc

# Values (e.g., actions/checkout) hold paths, not prose
[*.{yaml,yml}]
scc.Slashes = NO

[CODE_OF_CONDUCT.md]
scc.EmDashes = NO
