#
# .github/workflows/codeql.yaml
# swift-cascading-configuration
#
---
name: CodeQL
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
  - cron: 44 14 * * 4
    timezone: America/New_York
  workflow_dispatch: {}
permissions: {}
defaults:
  run:
    # Does not force arm64, because CodeQL runs x86_64 binaries, which need Rosetta 2
    shell: /bin/zsh -efux --extended-glob --pipe-fail --warn-create-global {0}
jobs:
  analyze:
    name: Analyze ${{matrix.language}}
    runs-on: ${{matrix.runner}}
    permissions:
      security-events: write
    strategy:
      matrix:
        include:
        # Analyzes the workflows on Linux, so that it never waits for 1 of the few concurrent macOS runners
        - language: actions
          build-mode: none
          runner: ubuntu-latest
        - language: swift
          build-mode: manual
          # CodeQL cannot trace builds on macOS 27 or newer
          runner: macos-26
          queries: +security-and-quality
      fail-fast: false
    steps:
    - name: 🛒 Checkout repo
      env:
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: init.defaultBranch
        GIT_CONFIG_VALUE_0: ${{github.event.repository.default_branch}}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Include all history & tags for Scripts/version
        fetch-depth: 0
        persist-credentials: false

    - name: 🔧 Setup repo
      # Only the Swift build needs it, and Linux has no zsh
      if: matrix.language == 'swift'
      run: Scripts/setup-workflow-repo

    - name: 🔩 Initialize CodeQL
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        languages: ${{matrix.language}}
        build-mode: ${{matrix.build-mode}}
        queries: ${{matrix.queries}}

    - name: 🏗 Build Swift
      if: matrix.language == 'swift'
      run: |
        # CodeQL cannot trace builds with Xcode 27 or newer, nor analyze Swift 6.4 or newer. Sort by version without the
        # .app suffix, so that, e.g., Xcode_26.1.app sorts after Xcode_26.app
        readonly xcode_path=(/Applications/Xcode_26(|.[0-9.]##).app(/nOe:'REPLY=${REPLY%.app}':[1]))
        sudo xcode-select -s "${xcode_path}"
        printf $'DEVELOPER_DIR=%s/Contents/Developer\n' "${xcode_path}" >>"${GITHUB_ENV}"
        Scripts/build -c release

    - name: 🔍 Perform CodeQL analysis
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        category: /language:${{matrix.language}}
