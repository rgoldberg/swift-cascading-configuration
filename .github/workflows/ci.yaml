#
# .github/workflows/ci.yaml
# swift-cascading-configuration
#
---
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Detect each new dependency release that breaks the build or tests
  schedule:
  - cron: 53 4 * * *
    timezone: America/New_York
concurrency:
  # Cancels only an outdated run of a pull request, so that each run on main completes, letting release-start.yaml
  # release its commit
  group: ${{github.workflow}}-${{github.event_name == 'pull_request' && github.ref || github.run_id}}
  cancel-in-progress: true
permissions: {}
jobs:
  build-test:
    name: Build & Test
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel, macos-26, macos-26-intel, xcode-27]
        swift: ['6.2', '6.3', '6.4']
        # Swift 6.2 & 6.3 cannot read the module interfaces of the SDK of Xcode 27, which bundles Swift 6.4
        exclude:
        - runner: xcode-27
          swift: '6.2'
        - runner: xcode-27
          swift: '6.3'
      fail-fast: false
    runs-on: ${{matrix.runner}}
    defaults: &defaults
      run:
        # Force all run commands to not use Rosetta 2 on arm64
        shell: >-
          ${{
            endsWith(matrix.runner, '-intel')
            && '/bin/zsh -efux --extended-glob --pipe-fail --warn-create-global {0}'
            || 'arch -arm64 /bin/zsh -efux --extended-glob --pipe-fail --warn-create-global {0}'
          }}
    steps:
    - &checkout
      name: 🛒 Checkout repo
      env:
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: init.defaultBranch
        GIT_CONFIG_VALUE_0: ${{github.event.repository.default_branch}}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Include all history & tags for Scripts/version
        fetch-depth: 0
        persist-credentials: false

    - &setup-repo
      name: 🔧 Setup repo
      run: Scripts/setup-workflow-repo

    - &select-xcode
      name: 🛠 Select latest stable Xcode
      run: |
        # Sort by version without the .app suffix, so that, e.g., Xcode_27.1.app sorts after Xcode_27.app
        readonly xcode_path=(/Applications/Xcode_[0-9.]##.app(/nOe:'REPLY=${REPLY%.app}':[1]))
        sudo xcode-select -s "${xcode_path}"
        printf $'DEVELOPER_DIR=%s/Contents/Developer\n' "${xcode_path}" >>"${GITHUB_ENV}"

    - name: 🕊 Use Swiftly Swift
      if: matrix.runner != 'xcode-27'
      env:
        SWIFT_VERSION: ${{matrix.swift}}
      run: |
        # Install Swiftly from swift.org instead of from Homebrew, which no longer bottles updated formulae for x86_64
        curl -fsSLo "${RUNNER_TEMP}/swiftly.pkg" https://download.swift.org/swiftly/darwin/swiftly.pkg
        # Rejects a pkg that Swift Open Source did not sign, or that Apple did not notarize
        signature="$(pkgutil --check-signature "${RUNNER_TEMP}/swiftly.pkg")"
        readonly signature
        if [[
          "${signature}" != *'Notarization: trusted by the Apple notary service'*
          || "${signature}" != *'1. Developer ID Installer: Swift Open Source (V9AUD2URP3)'*
        ]]; then
          printf $'::error::swiftly.pkg is not signed by Swift Open Source & notarized by Apple\n' >&2
          exit 1
        fi
        installer -pkg "${RUNNER_TEMP}/swiftly.pkg" -target CurrentUserHomeDirectory
        path=(~/.swiftly/bin "${path[@]}")
        # Runs outside the checkout, so that Swiftly sets its global default instead of rewriting .swift-version
        cd "${RUNNER_TEMP}"
        swiftly init -ny --skip-install
        swiftly install -y --use "${SWIFT_VERSION}"
        # Adds the toolchain itself, because the Swiftly swift proxy would use the toolchain that .swift-version names
        printf $'%s/usr/bin\n' "$(swiftly use --print-location)" >>"${GITHUB_PATH}"

    - &test-dependency-versions
      name: 🧪 Build & test with oldest & newest dependencies
      run: Scripts/test-dependency-versions -c release

    - &reject-modified-files
      name: 🧼 Reject modified files
      # Runs even after a failure, so that 1 run reports every failure
      if: ${{!cancelled()}}
      run: |
        # A step that modifies a file (e.g., .swift-version) makes Scripts/version report a dirty working tree
        if [[ -n "$(git status --porcelain)" ]]; then
          git status --porcelain
          printf $'::error::Steps modified the files above\n' >&2
          exit 1
        fi

  build-test-linux:
    name: Build & Test (${{matrix.container}})
    strategy:
      matrix:
        container: [swift:6.2, swift:6.3, swift:6.4]
      fail-fast: false
    runs-on: ubuntu-latest
    container: ${{matrix.container}}
    defaults:
      run:
        # zsh is installed only in the container, so the runner must not look up an absolute path on the host
        shell: zsh -efux --extended-glob --pipe-fail --warn-create-global {0}
    steps:
    - name: 💤 Install jq & zsh
      shell: bash
      run: apt-get update -q && apt-get install -qy jq zsh

    - *checkout

    - name: 🔧 Setup repo
      run: |
        # The container user does not own the checkout
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        Scripts/setup-workflow-repo

    - *test-dependency-versions

    - *reject-modified-files

  build-test-android:
    name: Build & Test (Android)
    permissions:
      contents: read
    # editorconfig-checker-disable
    # yamllint disable-line rule:line-length
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@e8b910942e79fb2c0654a87804d8f16e2304285c # 0.0.19
    # editorconfig-checker-enable
    with:
      enable_linux_checks: false
      enable_windows_checks: false
      enable_android_sdk_build: true
      enable_android_sdk_checks: true
      # Swift 6.3 is the 1st version that has a released Swift SDK for Android
      android_sdk_versions: '["6.3", "6.4"]'

  build-test-windows:
    name: Build & Test (Windows)
    permissions:
      contents: read
    # editorconfig-checker-disable
    # yamllint disable-line rule:line-length
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@e8b910942e79fb2c0654a87804d8f16e2304285c # 0.0.19
    # editorconfig-checker-enable
    with:
      enable_linux_checks: false
      windows_swift_versions: '["6.2", "6.3", "6.4"]'

  build-apple-platform:
    name: Build (${{matrix.platform}})
    strategy:
      matrix:
        runner: [xcode-27]
        # macOS is built & tested above; a simulator would run tests the same way as macOS does, so only building for
        # each generic device catches each platform's own problems (e.g., an unavailable API, or 32-bit Int on watchOS)
        platform: [iOS, tvOS, watchOS, visionOS]
      fail-fast: false
    runs-on: ${{matrix.runner}}
    defaults: *defaults
    steps:
    - *checkout

    - *setup-repo

    - *select-xcode

    - name: 🏗 Build library & tests
      env:
        PLATFORM: ${{matrix.platform}}
      run: |
        xcodebuild build-for-testing\
          -scheme swift-cascading-configuration\
          -destination "generic/platform=${PLATFORM}"\
          CODE_SIGNING_ALLOWED=NO

    - *reject-modified-files

  lint:
    name: Lint
    strategy:
      matrix:
        runner: [xcode-27]
    runs-on: ${{matrix.runner}}
    defaults: *defaults
    steps:
    - *checkout

    - *setup-repo

    - *select-xcode

    - name: 👢 Bootstrap
      run: Scripts/bootstrap

    - name: 🚨 Lint
      run: Scripts/lint

    - name: 📚 Build documentation
      # Runs even after a lint failure, so that 1 run reports every failure
      if: ${{!cancelled()}}
      run: Scripts/docs

    - *reject-modified-files
