#
# .vale/scc/Ampersands.yml
# swift-cascading-configuration
#
# Vale 3.28.1
#
---
extends: existence
message: Prefer '&' to 'and' (except in 'and/or' & after a comma that separates distinct clauses)
level: error
nonword: true
tokens:
- (?<!,)\s\band\b(?!/)
# A qualifier that follows a comma (e.g., ', and only if') never starts a distinct clause
- ',\sand\sonly\s(?:after|before|down|if|once|up|when)\b'
